<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Formularz Złoto-Czarny</title>
<style>
    body {
        background-color: black;
        color: gold;
        font-family: Arial, sans-serif;
        padding: 20px;
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }
    input[type="text"], input[type="password"], select {
        margin-top: 5px;
        padding: 5px;
        border: 1px solid gold;
        background-color: black;
        color: gold;
    }
    input[type="checkbox"], input[type="radio"] {
        margin-right: 5px;
    }
    input[type="submit"] {
        margin-top: 15px;
        padding: 10px 20px;
        background-color: gold;
        color: black;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }
    input[type="submit"]:hover {
        background-color: #ffd700cc;
    }
</style>
</head>
<body>
<form>
    <label>Podaj imię:</label>
    <input type="text" name="imie">

    <label>Podaj hasło:</label>
    <input type="password" name="haslo">

    <label>Wybierz ulubiony kolor:</label>
    <input type="radio" name="kolor" value="Czarny"> Czarny
    <input type="radio" name="kolor" value="Złoty"> Złoty
    <input type="radio" name="kolor" value="Biały"> Biały

    <label>Wybierz ulubione owoce:</label>
    <input type="checkbox" name="owoce" value="Jablko"> Jabłko
    <input type="checkbox" name="owoce" value="Wisnia"> Wiśnia
    <input type="checkbox" name="owoce" value="Malina"> Malina

    <label>Wybierz ulubiony przedmiot:</label>
    <select name="przedmiot">
        <option>Informatyka</option>
        <option>Matematyka</option>
        <option>Fizyka</option>
    </select>

    <br>
    <input type="submit" value="Wyślij">
</form>
</body>
</html>
