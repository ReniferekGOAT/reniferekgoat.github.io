<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Ankieta użytkownika</title>
      <link rel="icon" href="ankieta_favicon.png" type="image/jpeg">
<style>
    body {
        background-color: black;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: gold;
    }

    form {
        border: 2px solid gold;
        border-radius: 10px;
        padding: 20px 30px;
        max-width: 400px;
        width: 100%;
    }

    a {
        text-decoration: none;
        color: gold;
        display: inline-block;
        margin-bottom: 15px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input[type="text"], input[type="password"], select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid gold;
        border-radius: 5px;
        background-color: black;
        color: gold;
    }

    input[type="radio"], input[type="checkbox"] {
        margin-right: 5px;
        accent-color: gold;
    }

    .checkbox-label {
        display: block;
        margin-top: 5px;
    }

    input[type="submit"] {
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        background-color: black;
        color: gold;
        border: 2px solid gold;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background-color: gold;
        color: black;
    }
</style>
</head>
<body>
<form>
    <a href="#">← Powrót do strony głównej</a>
    <h1>Ankieta użytkownika</h1>

    <label>Podaj imię:</label>
    <input type="text" name="imie">

    <label>Podaj hasło:</label>
    <input type="password" name="haslo">

    <label>Wybierz ulubiony kolor:</label>
    <input type="radio" name="kolor" value="Czarny"> Czarny
    <input type="radio" name="kolor" value="Zielony"> Zielony
    <input type="radio" name="kolor" value="Niebieski"> Niebieski
    <input type="radio" name="kolor" value="Złoty"> Złoty
 

    <label>Wybierz ulubione owoce:</label>
    <label class="checkbox-label"><input type="checkbox" name="owoce" value="Mango"> Mango </label>
    <label class="checkbox-label"><input type="checkbox" name="owoce" value="Jabłko"> Jabłko</label>
    <label class="checkbox-label"><input type="checkbox" name="owoce" value="Truskawka"> Truskawka</label>
    
    <label>Wybierz ulubiony przedmiot:</label>
    <select name="przedmiot">
        <option>Informatyka</option>
        <option>Matematyka</option>
        <option>WF</option>
    </select>

    <input type="submit" value="Wyślij ankietę">
</form>
</body>
</html>
