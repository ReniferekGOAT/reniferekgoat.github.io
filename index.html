<!doctype html>
<html lang="pl">
<head>
	<meta charset="utf-8">
	<meta name="description" content="Tu wpisz opis zawartości strony">
	<title>Hubert Derlatka – Strona startowa</title>

	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Poppins', sans-serif;
		}

		body {
			min-height: 100vh;
			background: radial-gradient(circle at top, #1a1a1a, #000);
			color: #d4af37;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.container {
			background: rgba(0,0,0,0.6);
			border: 1px solid #d4af37;
			border-radius: 20px;
			padding: 40px 60px;
			text-align: center;
			box-shadow: 0 0 40px rgba(212,175,55,0.25);
			animation: fadeIn 1.2s ease;
		}

		h1 {
			font-size: 3rem;
			margin-bottom: 10px;
			text-shadow: 0 0 15px rgba(212,175,55,0.6);
		}

		.name {
			font-size: 1.2rem;
			margin-bottom: 30px;
			color: #f5e6a8;
		}

		a {
			display: block;
			margin: 12px 0;
			padding: 14px 30px;
			text-decoration: none;
			color: #d4af37;
			border: 2px solid #d4af37;
			border-radius: 30px;
			transition: 0.3s;
		}

		a:hover {
			background: #d4af37;
			color: #000;
			box-shadow: 0 0 20px #d4af37;
			transform: scale(1.05);
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
	</style>
</head>

<body>

	<div class="container">
		<h1>Strona startowa</h1>
		<div class="name">Hubert Derlatka</div>

		<a href="https://reniferekgoat.github.io/zadanie1" target="_blank">Zadanie 1</a>
		<a href="https://reniferekgoat.github.io/zadanie2" target="_blank">Zadanie 2</a>
		<a href="https://reniferekgoat.github.io/zadanie3" target="_blank">Zadanie 3</a>
		<a href="https://reniferekgoat.github.io/kalkulator" target="_blank">Kalkulator</a>
		<a href="https://reniferekgoat.github.io/BMI" target="_blank">BMI</a>
	</div>

</body>
</html>
